packages:
  - "apps/*" # 应用：admin 管理后台、ipad 等
  - "packages/*" # 可复用包
  - "utils/*" # 共享工具：如 @utils/http-client

# 执行 pnpm run / exec 前不自动 install。
# 避免拷到断网麒麟后因 storeDir 不一致触发 modules purge。
verifyDepsBeforeRun: false

# 有网安装时顺带拉取 Linux 原生可选依赖，便于整包拷到断网银河麒麟；断网机勿再 pnpm install。
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

# 依赖版本目录（catalog）：全仓库统一版本源
# 子包 dependencies / devDependencies / peerDependencies 可用 "catalog:" 引用
catalog:
  # 运行时
  react: ^19.2.8
  react-dom: ^19.2.8

  # UI
  antd: ^6.6.0
  "@ant-design/icons": ^6.3.2

  # HTTP
  axios: ^1.19.0

  # Charts & Date
  echarts: ^6.1.0
  dayjs: ^1.11.22

  # Router
  react-router-dom: ^7.18.2

  # 构建
  vite: ^8.2.1
  "@vitejs/plugin-react-swc": ^4.3.3
  typescript: 6.0.3

  # 类型
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

# 允许 @swc/core、esbuild 执行安装脚本（pnpm 11 用 allowBuilds 替代 onlyBuiltDependencies）
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: false

# 新版本发布后的最短等待天数，0 表示不等待、可用最新版（与 pnpm ncu 行为相关）
minimumReleaseAge: 0

# 强制锁定传递依赖版本，用于修复重复安装或已知兼容问题
# antd 6.6.0 需要 useDelayState（@rc-component/util >= 1.12.0）
# antd / @rc-component/picker 会再装一份 dayjs，导致 DatePicker 中文 locale 不生效
overrides:
  "@rc-component/util": ^1.12.0
  dayjs: ^1.11.22

# peer 依赖解析规则：放宽第三方包声明的 peer 范围，减少安装告警
peerDependencyRules:
  ignoreMissing: [] # 需要忽略的缺失 peer 可填包名
  allowedVersions:
    react-lazy-load>react: ">=17"
    react-lazy-load>react-dom: ">=17"
