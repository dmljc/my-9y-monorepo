# ipad 平板端 Nginx 配置
#
# 部署前请修改：
#   1. listen / server_name（与 admin 错开端口或用不同域名）
#   2. root（对应 pnpm ipad:build 产物 apps/ipad/dist）
#   3. upstream 后端地址
#
# 示例：
#   pnpm ipad:build
#   将 dist 拷到 /var/www/ipad
#   本文件拷到 /etc/nginx/conf.d/ipad.conf
#   nginx -t && nginx -s reload

upstream ipad_backend {
	# 后端服务地址，按现场修改
	server 127.0.0.1:8088;
	keepalive 32;
}

server {
	listen 81;
	# listen [::]:81;
	server_name _;

	charset utf-8;
	root /var/www/ipad;
	index index.html;

	client_max_body_size 50m;
	client_body_timeout 60s;

	gzip on;
	gzip_min_length 1k;
	gzip_comp_level 5;
	gzip_vary on;
	gzip_proxied any;
	gzip_types
		text/plain
		text/css
		text/xml
		application/javascript
		application/json
		application/xml
		image/svg+xml
		font/ttf
		application/font-woff
		application/font-woff2;

	# 平板实时数据 WebSocket：/api/ws/tablet
	# 必须单独 location，避免普通接口被写成 Connection: upgrade
	location /api/ws/ {
		proxy_pass http://ipad_backend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_connect_timeout 30s;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
	}

	# 接口反代：前端 VITE_API_BASE_URL=/api，请求会打到 /api/...
	# 不要给 proxy_pass 加路径，才能把完整 URI（含 /api）转给后端
	location /api/ {
		proxy_pass http://ipad_backend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_connect_timeout 30s;
		proxy_send_timeout 120s;
		proxy_read_timeout 120s;
		proxy_buffering on;
	}

	# Vite 带 hash 的静态资源，可长期缓存
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
		try_files $uri =404;
	}

	# 入口 HTML 不缓存，避免发版后仍用旧 index.html
	location = /index.html {
		add_header Cache-Control "no-store, no-cache, must-revalidate";
	}

	# SPA History 路由回退
	location / {
		try_files $uri $uri/ /index.html;
	}
}
